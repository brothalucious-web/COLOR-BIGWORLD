plugins { id 'fabric-loom' version '1.8.13' }
version = '1.0.0'
group = 'dev.bigworld'
base { archivesName = 'color-bigworld' }
repositories { mavenCentral() }
dependencies { minecraft 'com.mojang:minecraft:1.21.2'; mappings 'net.fabricmc:yarn:1.21.2+build.1:v2'; modImplementation 'net.fabricmc:fabric-loader:0.16.9'; modImplementation 'net.fabricmc.fabric-api:fabric-api:0.106.1+1.21.2' }
processResources { filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
